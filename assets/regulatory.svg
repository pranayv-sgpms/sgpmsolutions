<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"></stop>
      <stop offset="100%" style="stop-color:#dbeafe"></stop>
    </linearGradient>
    <linearGradient id="ceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
